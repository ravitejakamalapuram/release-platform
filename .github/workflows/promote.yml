# Reusable Google Play promotion / staged-rollout control.
#
#   action: promote   copy the newest release on from_track to to_track (staged if user_fraction < 1)
#           rollout   raise the user fraction of the in-progress (or halted) release on to_track
#           halt      halt the in-progress release on to_track
#           complete  roll the in-progress/halted release on to_track out to 100%
#
# Runs in a GitHub environment (default "production") so the caller repo can require approval.
name: promote

on:
  workflow_call:
    inputs:
      action:
        description: 'promote | rollout | halt | complete'
        type: string
        default: promote
      package:
        description: 'Application id. Default: the first android target in release.yaml.'
        type: string
        default: ''
      from_track:
        type: string
        default: internal
      to_track:
        type: string
        default: production
      user_fraction:
        description: 'Staged rollout fraction in (0, 1]. Empty = 100% (for promote/rollout).'
        type: string
        default: ''
      environment:
        description: 'GitHub environment to run in (protect it with required reviewers).'
        type: string
        default: production
      platform_ref:
        description: 'Advanced: release-platform ref for the helper scripts. Default: the ref this workflow was called at.'
        type: string
        default: ''

concurrency:
  group: release-platform-promote-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

env:
  WIF_PROVIDER: projects/335964689163/locations/global/workloadIdentityPools/github/providers/github-oidc
  SERVICE_ACCOUNT: release-bot@rk-release-platform.iam.gserviceaccount.com

defaults:
  run:
    shell: bash

jobs:
  # Reads the caller's release.yaml (data only; no app code runs anywhere in this workflow).
  # Kept in its own job without id-token so the job that can mint store tokens never checks out
  # caller content at all.
  config:
    name: Resolve package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      package: ${{ steps.pkg.outputs.package }}
    steps:
      - name: Check inputs
        env:
          ACTION: ${{ inputs.action }}
        run: |
          case "$ACTION" in promote|rollout|halt|complete) ;; *)
            echo "::error::Unknown action '$ACTION' (expected promote, rollout, halt or complete)"; exit 1 ;;
          esac

      - name: Checkout release.yaml
        if: inputs.package == ''
        uses: actions/checkout@v7
        with:
          sparse-checkout: release.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve package
        id: pkg
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ -z "$PACKAGE" ]; then
            PACKAGE=$(yq '[.targets[] | select(.type == "android")][0].package // ""' release.yaml)
          fi
          if ! [[ "$PACKAGE" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ ]]; then
            echo "::error::No valid package: pass the package input or add an android target to release.yaml (got '$PACKAGE')"; exit 1
          fi
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

  # Holds id-token: runs only release-platform scripts; never checks out the caller repo.
  play:
    name: ${{ inputs.action }} (${{ inputs.to_track }})
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve release-platform ref
        id: platform
        env:
          OVERRIDE: ${{ inputs.platform_ref }}
        run: |
          if [ -n "$OVERRIDE" ]; then echo "sha=$OVERRIDE" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::The calling workflow must grant 'permissions: id-token: write'."; exit 1
          fi
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=release-platform-self" | jq -r .value)
          echo "::add-mask::$token"
          payload=$(cut -d. -f2 <<<"$token" | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          echo "sha=$(base64 -d <<<"$payload" | jq -r .job_workflow_sha)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: ravitejakamalapuram/release-platform
          ref: ${{ steps.platform.outputs.sha }}
          path: platform
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Authenticate to Google (keyless)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: ${{ inputs.action }}
        id: play
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          ACTION: ${{ inputs.action }}
          PACKAGE: ${{ needs.config.outputs.package }}
          FROM: ${{ inputs.from_track }}
          TO: ${{ inputs.to_track }}
          FRACTION: ${{ inputs.user_fraction }}
        run: |
          args=("$ACTION" --package "$PACKAGE")
          if [ "$ACTION" = "promote" ]; then args+=(--from "$FROM" --to "$TO"); else args+=(--track "$TO"); fi
          if [ -n "$FRACTION" ]; then args+=(--fraction "$FRACTION"); fi
          node platform/scripts/play.mjs "${args[@]}"

      - name: Summary
        if: always()
        env:
          ACTION: ${{ inputs.action }}
          PACKAGE: ${{ needs.config.outputs.package }}
          RESULT: ${{ steps.play.outputs.result }}
          OUTCOME: ${{ steps.play.outcome }}
        run: |
          {
            echo "## Google Play: $ACTION"
            echo ""
            echo "| Package | Result |"
            echo "| --- | --- |"
            echo "| \`$PACKAGE\` | ${RESULT:-$OUTCOME} |"
          } >> "$GITHUB_STEP_SUMMARY"
