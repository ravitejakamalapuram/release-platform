# Daily app performance snapshot: GA4 users + Google Play installs/uninstalls for every app in performance.json.
# Output: performance.json on the `performance` branch. Replaces the Supermetrics-backed hub.
name: performance

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions: {}

env:
  WIF_PROVIDER: projects/335964689163/locations/global/workloadIdentityPools/github/providers/github-oidc
  SERVICE_ACCOUNT: release-bot@rk-release-platform.iam.gserviceaccount.com

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: '22'
      - name: Authenticate (Analytics, read-only)
        id: ga
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          create_credentials_file: false
      - name: Authenticate (Play reports bucket, read-only)
        id: play
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/devstorage.read_only
          create_credentials_file: false
      - name: Collect
        env:
          GA_TOKEN: ${{ steps.ga.outputs.access_token }}
          PLAY_TOKEN: ${{ steps.play.outputs.access_token }}
        run: node scripts/performance.mjs --config performance.json --out "$RUNNER_TEMP/performance.json"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/branch"
          git init -q -b performance "$dir"
          cp "$RUNNER_TEMP/performance.json" "$dir/performance.json"
          cd "$dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add performance.json
          git commit -q -m "chore(performance): daily snapshot"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" push -q --force \
            "https://github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/performance
