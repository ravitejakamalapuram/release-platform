# Daily store dashboard for every app in apps.yaml.
# Output: the run's job summary and STATUS.md on the `status` branch.
name: dashboard

on:
  schedule:
    - cron: '0 2 * * *'   # 07:30 IST, just before the CEO's 08:00 IST daily brief
  workflow_dispatch:

permissions: {}

jobs:
  status:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/status.yml
    with:
      publish_branch: status
